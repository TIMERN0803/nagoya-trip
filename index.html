<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="看花花">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="11/17–11/24 名古屋 8 天行程、天氣、交通、記帳與清單">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>名古屋看花花</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 淺色手帳。首頁＝倒數卡（插畫＋左文字右大數字）＋ 8 天地點插畫格；點格子進入當日。底部 5 格分頁列，選中的那格換成彩色插畫圖示並浮出。
   單一淺色主題。類別色只用在標籤與記帳，介面本體只有棕＋薄荷。 */
:root{
  color-scheme:light;
  --paper:#F8F3EC; --card:#FFFFFF; --sunk:#F0E7DB; --line:#E3D6C4;
  --ink:#3F3127; --muted:#76665A; --brown:#9A6E4C; --brown-soft:#E8D6C2;
  --mint:#7CC8B4; --mint-soft:#DDF1EA; --mint-ink:#24695A;
  --coral-soft:#FDE6DC; --coral-line:#F0B49E; --coral-ink:#A64A2E;
  --c-move-bg:#DCEBF7; --c-move:#2D5F8A;
  --c-go-bg:#DDF0E2;   --c-go:#2E6B45;
  --c-eat-bg:#FDE3D2;  --c-eat:#A24E1F;
  --c-stay-bg:#EBE2F6; --c-stay:#5E4590;
  --c-do-bg:#FBDDE6;   --c-do:#A33A5E;
  --c-buy-bg:#FBEFC8;  --c-buy:#7A5A06;
  --c-etc-bg:#ECE6DF;  --c-etc:#5E5248;
  --f-display:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --shadow:0 2px 0 var(--line);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--mint-ink);outline-offset:2px;border-radius:10px}
.shell{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 124px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;text-wrap:balance}

.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.bar .logo{width:66px;height:32px;flex:none}
.bar h1{font-size:20px;margin:0;letter-spacing:.02em}
.bar .back{position:relative;display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 8px;font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer}
.bar .back svg{width:20px;height:20px;color:var(--brown)}
.bar .right{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}

.hero{background:var(--card);border-radius:30px;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow);margin-top:6px}
.hero .scene{display:block;width:100%;height:auto;aspect-ratio:320/170}
.hero .body{padding:16px 20px 18px;display:flex;align-items:center;gap:12px}
.hero .txt{min-width:0;flex:1}
.hero .lbl{font-family:var(--f-display);font-weight:900;font-size:17px}
.hero .sub{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.hero .big{flex:none;text-align:right;font-family:var(--f-display);font-weight:900;line-height:.85;font-size:72px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big small{display:block;font-size:14px;letter-spacing:0;color:var(--brown);margin-top:8px;line-height:1}
.hero .body.col{flex-direction:column;align-items:stretch;gap:12px}
.cd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cd-d{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:900;line-height:.85}
.cd-d b{font-size:72px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd-d small{font-size:20px;color:var(--brown)}
.hms{display:flex;gap:6px}
.hms span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px;background:var(--sunk);border-radius:14px;padding:8px 6px 6px;font-family:var(--f-display)}
.hms b{font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hms i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);line-height:1}
.hero .foot{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}

.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--sunk);color:var(--ink);border:0;text-decoration:none;cursor:pointer;transition:transform .12s}
.chip::after,.bar .back::after,.day-btn::after{content:"";position:absolute;inset:-6px -3px}
.chip:active{transform:scale(.95)}
.acts{row-gap:10px}
.chip svg{width:15px;height:15px;color:var(--brown)}
.chip.mint{background:var(--mint-soft);color:var(--mint-ink)}
.chip.mint svg{color:var(--mint-ink)}
.chip.coral{background:var(--coral-soft);color:var(--coral-ink);box-shadow:inset 0 0 0 1.5px var(--coral-line)}
.chip.coral svg{color:var(--coral-ink)}

.sheet{position:relative;background:var(--card);border-radius:30px;margin-top:26px;padding:22px 16px 18px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.clips{position:absolute;top:-12px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}
.clips i{width:15px;height:24px;border-radius:0 0 7px 7px;background:var(--brown)}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:19px}
.sheet-head span{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.tile{border:0;background:none;padding:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .art{width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;transition:transform .18s}
.tile:active .art{transform:scale(.95)}
.tile .art svg{display:block;width:100%;height:100%}
.tile b{font-family:var(--f-display);font-weight:900;font-size:14px;line-height:1.3}
.tile small{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted);margin-top:-3px;font-variant-numeric:tabular-nums}
.tile.past{opacity:.55}
.tile.today .art{outline:3px solid var(--mint);outline-offset:2px}

.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0 10px}
.days{display:flex;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:1 0 38px;border:0;background:none;border-radius:999px;padding:5px 0;cursor:pointer;font-family:var(--f-display);display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:background .2s}
.day-btn b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.day-btn small{font-size:11px;font-weight:700;color:var(--muted)}
.days{position:relative}
.days .ind{position:absolute;left:5px;top:5px;bottom:5px;border-radius:999px;background:var(--mint);transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s;z-index:0}
.day-btn{position:relative;z-index:1}
.day-btn[aria-selected="true"] small,.day-btn[aria-selected="true"] b{color:#123F35}
.day-btn .dh{width:30px;height:24px;margin-top:-1px;animation:pop .25s ease}
.day-btn.today:not([aria-selected="true"]) b{color:var(--mint-ink)}

.banner{background:var(--card);border-radius:28px;border:1.5px solid var(--line);box-shadow:var(--shadow);padding:14px 16px 16px}
.banner .top{display:flex;gap:14px;align-items:center}
.banner .art{flex:none;width:108px;height:108px;border-radius:22px;overflow:hidden;display:block}
.banner .ttl{min-width:0}
.banner .when{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--brown)}
.banner h2{margin:2px 0 0;font-size:23px;line-height:1.25}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:6px;font-size:13px;color:var(--muted)}
.route svg{width:11px;height:11px;color:var(--brown)}
.wx{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.wx svg{width:34px;height:34px;flex:none}
.wx .temp{font-family:var(--f-display);font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx .temp span{font-size:15px;color:var(--muted)}
.wx .w-meta{font-size:12.5px;color:var(--muted);line-height:1.45;min-width:0}
.wx .w-meta b{color:var(--ink);font-weight:700}

.notes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--coral-soft);border:1.5px solid var(--coral-line);border-radius:18px;padding:10px 14px;font-size:14px;color:var(--ink)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--coral-ink)}

.tl{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start}
.item .t{font-family:var(--f-display);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;padding-top:14px;line-height:1.2}
.item .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.item .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px 13px;box-shadow:var(--shadow)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px 1px 6px;background:var(--tb);color:var(--tc);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tc) 22%,transparent)}
.tag svg{width:14px;height:14px}
.item .card h3{margin:6px 0 0;font-size:16.5px;line-height:1.4;font-weight:900}
.item .card .jp{font-size:12.5px;color:var(--muted)}
.item .card p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.c-move{--tb:var(--c-move-bg);--tc:var(--c-move)} .c-go{--tb:var(--c-go-bg);--tc:var(--c-go)} .c-eat{--tb:var(--c-eat-bg);--tc:var(--c-eat)}
.c-stay{--tb:var(--c-stay-bg);--tc:var(--c-stay)} .c-do{--tb:var(--c-do-bg);--tc:var(--c-do)} .c-buy{--tb:var(--c-buy-bg);--tc:var(--c-buy)} .c-etc{--tb:var(--c-etc-bg);--tc:var(--c-etc)}

details.sched{margin-top:18px;background:var(--card);border-radius:24px;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow)}
details.sched summary{cursor:pointer;padding:12px 18px;list-style:none;display:flex;align-items:center;gap:10px}
details.sched summary::-webkit-details-marker{display:none}
.sbody{overflow:hidden}
details.sched summary svg.m{width:56px;height:40px;flex:none}
details.sched summary b{font-family:var(--f-display);font-weight:900;font-size:16px;display:block}
details.sched summary small{color:var(--muted);font-size:12.5px}
details.sched summary::after{content:"";margin-left:auto;width:9px;height:9px;border:solid var(--brown);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);transition:transform .2s;flex:none}
details.sched[open] summary::after{transform:rotate(-135deg)}
.srow{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 18px;border-top:2px dashed var(--line);font-size:14px}
.srow .st{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.srow.move{font-size:13px;color:var(--muted);padding-block:6px;background:var(--paper)}
.srow.star{background:var(--mint-soft)}
.srow b{font-family:var(--f-display);font-weight:900}
.srow p{margin:1px 0 0;color:var(--muted);font-size:13px}
.tips{padding:12px 18px 16px;border-top:2px dashed var(--line);font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tips b{color:var(--ink)}

.page-title{font-size:22px;margin:8px 0 2px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.illo{display:block;width:100%;height:auto;border-radius:28px;border:1.5px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border-radius:24px;padding:16px 18px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.gap{height:14px}

.wxrow{display:grid;grid-template-columns:54px 34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.wxrow:first-child{border-top:0;padding-top:0}
.wxrow:last-child{padding-bottom:0}
.wxrow .d{font-family:var(--f-display);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.wxrow .d small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.wxrow svg{width:32px;height:32px}
.wxrow .p{font-size:13.5px;color:var(--muted);line-height:1.4}
.wxrow .p b{color:var(--ink);font-weight:700}
.wxrow .t{font-family:var(--f-display);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.wxrow .t span{color:var(--muted);font-weight:700}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:12px}
.src.avg{background:var(--sunk);color:var(--muted)}
.src.live{background:var(--mint-soft);color:var(--mint-ink)}
.tip{display:flex;gap:12px;align-items:center;background:var(--mint-soft);border:1.5px solid #B6E0D3;border-radius:24px;padding:14px 16px;font-size:14px}
.tip svg{width:66px;height:48px;flex:none}
.tip b{font-family:var(--f-display);font-weight:900}

.pass .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pass .ap{font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.pass .ap small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);margin-top:6px}
.pass .r{text-align:right}
.pass .mid{text-align:center;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted)}
.pass .mid svg{width:30px;height:30px;color:var(--c-move);display:block;margin:0 auto 2px}
.pass .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:2px dashed var(--line);margin-top:14px;padding-top:10px;font-size:13px;color:var(--muted)}
.pass .foot b{color:var(--ink)}
.opt h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opt h3 span{color:var(--brown);font-size:19px;white-space:nowrap}
.opt ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.opt li+li{margin-top:3px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--coral-soft);border:1.5px solid var(--coral-line);border-radius:20px;padding:12px 16px;font-size:14px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--coral-ink)}

.sync{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:12px;max-width:100%}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--brown-soft);flex:none}
.sync.on i{background:var(--mint)}
.group{background:var(--card);border-radius:24px;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.group h3{margin:0;padding:14px 18px 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.prog{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--mint-ink);background:var(--mint-soft);border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:2px dashed var(--line);cursor:pointer}
.chk input{appearance:none;flex:none;width:26px;height:26px;border:2.5px solid #CDB79F;border-radius:50%;margin:0;display:grid;place-items:center;background:var(--card);cursor:pointer;transition:background .15s,border-color .15s}
.chk input:checked{background:var(--mint-ink);border-color:var(--mint-ink)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .txt{min-width:0;flex:1}
.chk .txt b{font-weight:700;display:block}
.chk .txt small{color:var(--muted);font-size:13px}
.chk input:checked + .txt b{text-decoration:line-through;color:var(--muted)}
.chk .due{flex:none;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--coral-ink);background:var(--coral-soft);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}

.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sum .k{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.sum .v{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.sum .tw{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum .r{text-align:right}
.bar-cat{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk);margin-top:14px}
.bar-cat i{display:block;height:100%;background:var(--tc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--tc)}
.settle{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-size:14px}
.settle svg{width:52px;height:38px;flex:none}
.settle b{font-family:var(--f-display);font-weight:900;font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:8px}
.rate input{width:96px;min-height:36px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--paper);font-variant-numeric:tabular-nums}

.form .amt{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:18px;padding:6px 14px;background:var(--paper)}
.form .amt span{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--brown)}
.form .amt input{border:0;background:none;outline:none;font-family:var(--f-display);font-weight:900;font-size:28px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.form .amt:focus-within{border-color:var(--mint-ink)}
.form .l{display:block;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);margin:12px 0 6px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pick svg{width:15px;height:15px}
.pick[aria-pressed="true"]{background:var(--tb,var(--mint-soft));color:var(--tc,var(--mint-ink));border-color:var(--tc,var(--mint-ink))}
.pick.who svg{width:20px;height:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);font-size:14.5px}
.field:focus{outline:none;border-color:var(--mint-ink)}
.primary{width:100%;margin-top:14px;border:0;border-radius:16px;padding:12px;background:var(--mint-ink);color:#fff;font-family:var(--f-display);font-weight:900;font-size:16px;cursor:pointer}
.primary:disabled{background:var(--brown-soft);color:var(--muted);cursor:not-allowed}
.form .msg{font-size:13px;color:var(--mint-ink);font-weight:700;margin-top:8px;min-height:1em}
.form .msg.err{color:var(--coral-ink)}

.day-group h4{font-family:var(--f-display);font-weight:900;font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}
.day-group h4 span{color:var(--muted);font-variant-numeric:tabular-nums}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.ex .ic{flex:none;width:36px;height:36px;border-radius:12px;background:var(--tb);display:grid;place-items:center}
.ex .ic svg{width:19px;height:19px;color:var(--tc)}
.ex .m{min-width:0;flex:1}
.ex .m b{display:block;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.ex .m small{color:var(--muted);font-size:12.5px}
.ex .a{font-family:var(--f-display);font-weight:900;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ex .del{display:block;margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;cursor:pointer;text-decoration:underline;font-family:var(--f-body)}
.ex .del.sure{color:var(--coral-ink);font-weight:700}
.ex[data-edit]{cursor:pointer;border-radius:12px;transition:background .15s}
.ex[data-edit]:active{background:var(--paper)}
.ex.editing{background:var(--mint-soft);margin:0 -8px;padding-inline:8px}
.ghost{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--card);font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer}
.code{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;font-size:14px}
.code-row{display:flex;gap:8px}
.code-row .field{flex:1;min-width:0}
.code-row .primary{width:auto;margin:0;padding:8px 16px;font-size:15px}
.empty{text-align:center;padding:4px 0;color:var(--muted);font-size:14px}
.empty svg{width:110px;height:70px;display:block;margin:0 auto 6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:#FFFDF9;border-radius:30px;padding:8px 6px 6px;border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(120,86,56,.16)}
nav.tabs button{position:relative;border:0;background:none;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:11.5px;padding:30px 0 2px;cursor:pointer}
nav.tabs button .ln,nav.tabs button .cl{position:absolute;left:50%;top:2px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
nav.tabs button .ln{width:26px;height:26px;transform:translateX(-50%)}
nav.tabs button .cl{width:46px;height:46px;opacity:0;transform:translate(-50%,8px) scale(.6)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:900}
nav.tabs button[aria-selected="true"] .ln{opacity:0}
nav.tabs button[aria-selected="true"] .cl{opacity:1;transform:translate(-50%,-22px) scale(1) rotate(-6deg)}

.ol :is(path,rect,circle,ellipse):not(.n,.n *),circle.ol,path.ol{stroke:#2B2420;stroke-width:2.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.step-a,.step-b{animation:step .8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.step-b{animation-delay:-.4s}
@keyframes step{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}
.cats-bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.view{animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes flash{0%,100%{outline-color:transparent}30%{outline-color:var(--mint)}}
.tile.flash .art{outline:3px solid transparent;outline-offset:2px;animation:flash 1.2s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- 角色：白貓「豆花」、黑貓「芝麻」（粗外框、平塗、大圓眼的站姿 Q 版） ---------- */
const LN="#2B2420";
/* 手繪感：深色粗線＋輕微抖動；頭大身小、尖耳、短胖手腳、大白眼斜看、只有小鼻子 */
document.getElementById("defs").insertAdjacentHTML("beforeend",`<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>`);
function headM(o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const look=o.look||2.4;
 const eye=(x)=>`<ellipse cx="${x}" cy="25" rx="7" ry="6.6" fill="#fff" ${s}/><circle cx="${x+look}" cy="25.6" r="3.4" fill="${LN}"/>`;
 return `<path d="M15 40 C9 32 10 20 13.5 11 L17.5 1.5 L29.5 12.5 Q35 10.8 40.5 12.5 L52.5 1.5 L56.5 11 C60 20 61 32 55 40 C49 45.5 21 45.5 15 40 Z" fill="${o.fur}" ${s}/>
  ${eye(27)}${eye(43)}
  <circle cx="${35+look*.5}" cy="33" r="1.8" fill="${o.nose}"/>
  <path d="M13 29 H6.5 M13.5 33.5 L7.5 35.5 M57 29 H63.5 M56.5 33.5 L62.5 35.5" stroke="${o.whisk||LN}" stroke-width="2.2" stroke-linecap="round"/>`;
}

function walkSym(id,o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const dbl=(d)=>`<path d="${d}" fill="none" stroke="${LN}" stroke-width="9.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.fur}" stroke-width="3.3" stroke-linecap="round"/>`;
 const eye=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" ${s}/><circle cx="${x-rx*.38}" cy="${y+.6}" r="${ry*.52}" fill="${LN}"/>`;

  <ellipse cx="35" cy="75" rx="28" ry="2.6" fill="#000" opacity=".1"/>
  ${dbl("M57 58 Q68 58 67 46")}
  <path d="M47 49 C52 48 56.5 49 57.5 52.5 C58 55.5 55 56.8 52.5 55.2" fill="${o.fur}" ${s}/>

  <path d="M24 48.5 C18.5 47.5 13.5 47.5 11.8 50.6 C10.6 53.6 13 56.6 16.2 56 C19 55.4 21.8 54.8 24 54.6" fill="${o.fur}" ${s}/>

  ${eye(19.5,25,5.4,6.2)}${eye(32,24.5,6.6,6.8)}

 </g></symbol>`;
}
function catSym(id,o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const dbl=(d)=>`<path d="${d}" fill="none" stroke="${LN}" stroke-width="9.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.fur}" stroke-width="3.3" stroke-linecap="round"/>`;
 let bodyPart;
 if(o.walk){
  /* 參考圖比例：身體圓胖、手腳又短又粗；短手往前後平伸，短腿一前一後成大步 */
  bodyPart=`${dbl("M17 58 Q5 58 5.5 47")}
  <path d="M21 42 C17 48 15 54 15 59 C11 61 8 65 9 69 C10 73 15 74.5 19.5 72.5 C22.5 71 25 68.5 27.5 66.5 Q35 63.5 42.5 66.5 C46 69.5 50 72.5 54.5 73 C59.5 73.2 63 69.5 61 65 C59 61.5 56 59 54 58 C54 53 52 47 49 42 Z" fill="${o.fur}" ${s}/>

 const sum=document.getElementById("acct-sum"),list=document.getElementById("acct-list");if(!sum)return;
 const total=expenses.reduce((a,e)=>a+e.amt,0);
 const byCat=ECAT.map(c=>[c,expenses.filter(e=>e.cat===c[0]).reduce((a,e)=>a+e.amt,0)]).filter(x=>x[1]>0);
 let bal=0;expenses.forEach(e=>{if(e.split==="both")bal+=e.who==="zhang"?e.amt/2:-e.amt/2});
 const settle=Math.abs(bal)<1?"目前兩人互不相欠":bal>0?`星星要給阿彰 <b>${yen(bal)}</b>`:`阿彰要給星星 <b>${yen(-bal)}</b>`;
 const per=PEOPLE.map(p=>[p[1],expenses.filter(e=>e.who===p[0]).reduce((a,e)=>a+e.amt,0)]);
 sum.innerHTML=`<div class="sum"><div><div class="k">旅程總花費</div><div class="v">${yen(total)}</div><div class="tw">約 NT$ ${Math.round(total*rate).toLocaleString("en-US")}</div></div>
  <div class="r"><div class="k">${per.map(p=>`${p[0]}付 ${yen(p[1])}`).join("<br>")}</div></div></div>
  ${total?`<div class="bar-cat">${byCat.map(([c,v])=>`<i class="${c[3]}" style="width:${(v/total*100).toFixed(2)}%"></i>`).join("")}</div><div class="legend">${byCat.map(([c,v])=>`<span class="${c[3]}"><i></i>${c[1]} ${yen(v)}</span>`).join("")}</div>`:""}
  <div class="settle"><svg aria-hidden="true"><use href="#cats"/></svg><span>${settle}</span></div>
  <label class="rate" for="f-rate">匯率 1 日圓 ＝ <input id="f-rate" inputmode="decimal" value="${rate}"> 台幣</label>`;
 if(!expenses.length){list.innerHTML=`<div class="empty"><svg viewBox="0 0 110 70" aria-hidden="true"><use href="#cats"/></svg>還沒有記帳。輸入金額後按「記下這筆」，就會出現在這裡。</div>`;return}
 const days=[...new Set(expenses.map(e=>e.day))].sort((a,b)=>b.localeCompare(a));
 list.innerHTML=days.map(d=>{const es=expenses.filter(e=>e.day===d).sort((a,b)=>(b.ts||0)-(a.ts||0));const x=DAYS.find(z=>z.d===d);
  return `<div class="day-group"><h4>${esc(d)}${x?`（${x.w}）`:""}<span>${yen(es.reduce((a,e)=>a+e.amt,0))}</span></h4>${es.map(e=>{const c=ECAT.find(z=>z[0]===e.cat)||ECAT[5];const p=PEOPLE.find(z=>z[0]===e.who)||PEOPLE[0];
   return `<div class="ex${editingId===e.id?" editing":""}"${canWrite?` data-edit="${esc(e.id)}" role="button" tabindex="0"`:""}><span class="ic ${c[3]}"><svg><use href="#${c[2]}"/></svg></span><div class="m"><b>${esc(e.note||c[1])}</b><small>${p[1]}付，${e.split==="both"?"兩人平分":"自己的"}${canWrite?"，點一下修改":""}</small></div><div class="a">${yen(e.amt)}${canWrite?`<button type="button" class="del${pendingDel===e.id?" sure":""}" data-del="${esc(e.id)}">${pendingDel===e.id?"確定刪除":"刪除"}</button>`:""}</div></div>`}).join("")}</div>`}).join('<div class="gap"></div>');
}
function groupHTML(title,rows,prep){
 const n=rows.filter(r=>done[r[0]]).length;
 return `<div class="group"><h3>${title}<span class="prog">${n} / ${rows.length}</span></h3>${rows.map(r=>`<label class="chk" for="c-${r[0]}"><input type="checkbox" id="c-${r[0]}"${done[r[0]]?" checked":""}${canWrite?"":" disabled"}><div class="txt"><b>${esc(r[1])}</b><small>${esc(r[2])}</small>${prep&&r[4]?`<div class="acts">${r[4].map(l=>ext(l[0],l[1])).join("")}</div>`:""}</div>${prep&&r[3]?`<span class="due">${esc(r[3])}</span>`:""}</label>`).join("")}</div>`;
}
function listHTML(){
 return `<header class="bar"><svg class="logo" aria-hidden="true"><use href="#heads"/></svg><h1>清單</h1></header>
 ${syncHTML()}
 <div class="stack">${groupHTML("行前待辦",PREP,true)}${groupHTML("要買的",BUY,false)}</div>`;
}

const scrollMem={};let curKey=null;
const viewKey=()=>tab==="plan"?"plan-"+view:tab;
function render(keep,restore){
 const y=scrollY;
 if(!keep&&curKey)scrollMem[curKey]=y;
 curKey=viewKey();
 const html=tab==="plan"?(view==="home"?homeHTML():dayHTML()):tab==="wx"?wxHTML():tab==="move"?moveHTML():tab==="acct"?acctHTML():listHTML();
 app.innerHTML=`<div class="view"${keep?' style="animation:none"':""}>${html}</div>`;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
 placeInd(false);
 if(tab==="acct")renderAcct();
 bindSched();
 scrollTo(0,keep?y:(restore?(scrollMem[curKey]||0):0));
}
function bindSched(){
 const d=document.getElementById("sched");if(!d)return;const sum=d.querySelector("summary"),body=d.querySelector(".sbody");
 sum.addEventListener("click",e=>{
  e.preventDefault();if(d.dataset.busy)return;
  const opening=!d.open;store.set("schedOpen",opening);
  if(reduce()||!body.animate){d.open=opening;return}
  d.dataset.busy=1;
  if(opening){d.open=true;const h=body.scrollHeight;body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:260,easing:"cubic-bezier(.2,.8,.2,1)"}).finished.then(()=>delete d.dataset.busy)}
  else{const h=body.scrollHeight;body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:200,easing:"ease-in"}).finished.then(()=>{d.open=false;delete d.dataset.busy})}
 });
}
function refresh(){
 if(tab==="acct"){renderAcct();return}
 if(tab==="list"){app.querySelectorAll(".chk input").forEach(i=>{i.checked=!!done[i.id.slice(2)];i.disabled=!canWrite});app.querySelectorAll(".group").forEach((g,k)=>{const rows=k?BUY:PREP;g.querySelector(".prog").textContent=`${rows.filter(r=>done[r[0]]).length} / ${rows.length}`});return}
 if(tab==="plan"&&view==="home")render(true);
}

app.addEventListener("click",e=>{
 const d=e.target.closest("[data-day]");if(d){const i=+d.dataset.day;if(tab==="plan"&&view==="day"&&d.classList.contains("day-btn")){switchDay(i);return}tab="plan";view="day";dayIdx=i;render();return}
 if(e.target.closest("[data-home]")){const from=dayIdx;view="home";render(false,true);const t=app.querySelector(`.tile[data-day="${from}"]`);if(t){const r=t.getBoundingClientRect();if(r.top<60||r.bottom>innerHeight-110)t.scrollIntoView({block:"center"});t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1300)}return}
 const g=e.target.closest("[data-go]");if(g){tab=g.dataset.go;render();return}
 const pk=e.target.closest(".pick");if(pk){const grp=pk.parentElement.dataset.pick;draft[grp]=pk.dataset.v;pk.parentElement.querySelectorAll(".pick").forEach(b=>b.setAttribute("aria-pressed",b===pk));return}
 const del=e.target.closest("[data-del]");if(del){const id=del.dataset.del;if(pendingDel!==id){pendingDel=id;renderAcct();clearTimeout(window._pd);window._pd=setTimeout(()=>{if(pendingDel===id){pendingDel=null;renderAcct()}},3000);return}pendingDel=null;removeExpense(id);return}
 const ed=e.target.closest("[data-edit]");if(ed){startEdit(ed.dataset.edit);return}
 if(e.target.closest("#f-cancel")){stopEdit();return}
});
app.addEventListener("keydown",e=>{const ed=e.target.closest&&e.target.closest("[data-edit]");if(ed&&(e.key==="Enter"||e.key===" ")&&e.target===ed){e.preventDefault();startEdit(ed.dataset.edit)}});
app.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="f-amt"){t.value=t.value.replace(/[^\d]/g,"").slice(0,8);draft.amt=t.value}
 if(t.id==="f-note")draft.note=t.value;
 if(t.id==="f-day")draft.day=t.value;
});
app.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="f-day"){draft.day=t.value;return}
 if(t.id==="f-rate"){const v=parseFloat(t.value);if(v>0&&v<10){rate=v;store.set("rate",rate);renderAcct();if(db&&canWrite){try{await db.doc("settings/rate").set({jpyTwd:v})}catch(_){}}}else{t.value=rate}return}
 if(!t.matches(".chk input"))return;
 const id=t.id.slice(2);done[id]=t.checked;store.set("done",done);refresh();
 if(db){try{await db.doc("checks/"+id).set({done:t.checked})}catch(err){if(err&&err.code==="invalid_argument"){canWrite=false;render(true)}}}
});
app.addEventListener("submit",async e=>{
 e.preventDefault();
 if(e.target.id==="code-form"){const v=(document.getElementById("f-code").value||"").trim();if(!v)return;try{localStorage.setItem(TRIP_KEY,v)}catch(_){};syncMsg="connecting";render(true);connect();return}
 const msg=document.getElementById("f-msg"),amt=parseInt(draft.amt,10);
 msg.className="msg";
 if(!amt||amt<=0){msg.className="msg err";msg.textContent="請先輸入金額";document.getElementById("f-amt").focus();return}
 const rec={amt,cat:draft.cat,who:draft.who,split:draft.split,day:draft.day,note:draft.note.trim(),ts:Date.now()};
 const btn=document.getElementById("f-save");btn.disabled=true;
 try{
  if(editingId){
   const id=editingId,old=expenses.find(x=>x.id===id);rec.ts=old?old.ts:rec.ts;
   if(db&&!id.startsWith("l"))await db.doc("expenses/"+id).set(rec);
   expenses=expenses.map(x=>x.id===id?{...rec,id}:x);if(!db)store.set("exp",expenses);
   editingId=null;draft.amt="";draft.note="";render(true);
   const m=document.getElementById("f-msg");m.className="msg";m.textContent=`已更新為 ${yen(amt)}`;return;
  }
  if(db){const ref=db.collection("expenses").doc();await ref.set(rec);if(!expenses.some(x=>x.id===ref.id))expenses.push({...rec,id:ref.id})}
  else{expenses.push({...rec,id:"l"+rec.ts});store.set("exp",expenses)}
  draft.amt="";draft.note="";
  document.getElementById("f-amt").value="";document.getElementById("f-note").value="";
  msg.textContent=`已記下 ${yen(amt)}`;renderAcct();
 }catch(err){msg.className="msg err";msg.textContent=err&&err.code==="invalid_argument"?"你沒有記帳權限，請擁有者分享時選 Contributor":"沒有存到，請確認網路後再按一次"}
 btn.disabled=false;
});
async function removeExpense(id){
 if(db&&!id.startsWith("l")){try{await db.doc("expenses/"+id).delete()}catch(_){}}
 expenses=expenses.filter(e=>e.id!==id);if(!db)store.set("exp",expenses);renderAcct();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{const t=b.dataset.tab;if(t===tab&&!(t==="plan"&&view==="day")){scrollTo({top:0,behavior:reduce()?"auto":"smooth"});return}if(tab==="plan"&&t==="plan"&&view==="day"){app.querySelector("[data-home]").click();return}tab=t;render(false,true)});

const h=location.hash.slice(1);
if(["wx","move","acct","list"].includes(h))tab=h;
if(todayIdx>=0){view="day";dayIdx=todayIdx}
render();

setInterval(()=>{const el=document.getElementById("cd-s");if(!el)return;const c=cdParts();if(c.ms<=0){render(true);return}
 document.getElementById("cd-d").textContent=c.d;document.getElementById("cd-h").textContent=p2(c.h);document.getElementById("cd-m").textContent=p2(c.m);el.textContent=p2(c.s)},1000);

/* ---------- 兩人共用：Firebase Firestore（用旅行代碼當門禁） ---------- */
const FIREBASE=null; /* 建好 Firebase 專案後把設定貼在這裡 */
const TRIP_KEY="ngy:code";
let syncMsg="";
function getCode(){
 const m=location.hash.match(/k=([\w-]+)/);
 if(m){try{localStorage.setItem(TRIP_KEY,m[1])}catch(_){};history.replaceState(null,"",location.pathname+location.search)}
 try{return localStorage.getItem(TRIP_KEY)}catch(_){return null}
}
function syncHTML(){
 if(live)return `<div class="sync on"><i></i><span>和同行者共用</span></div>`;
 if(!FIREBASE)return `<div class="sync"><i></i><span>記在這支手機上</span></div>`;
 if(syncMsg==="connecting")return `<div class="sync"><i></i><span>連線中…</span></div>`;
 if(syncMsg==="offline")return `<div class="sync"><i></i><span>目前離線，先記在這支手機上</span></div>`;
 return `<form class="box code" id="code-form" autocomplete="off"><b>${syncMsg==="bad"?"旅行代碼不對，請再確認一次":"輸入旅行代碼，就能和同行者共用記帳與清單"}</b>
  <div class="code-row"><input class="field" id="f-code" placeholder="旅行代碼" aria-label="旅行代碼" autocapitalize="off" spellcheck="false"><button class="primary" type="submit">開啟共用</button></div></form>`;
}
function rerenderData(){if(tab==="acct"||tab==="list")render(true);else if(tab==="plan"&&view==="home")render(true)}
let connecting=false;
async function connect(){
 const code=getCode();
 if(!FIREBASE||!code||connecting||live)return;
 connecting=true;
 try{
  const V="10.12.2";
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const fbApp=initializeApp(FIREBASE);
  let fs;try{fs=F.initializeFirestore(fbApp,{localCache:F.persistentLocalCache()})}catch(_){fs=F.getFirestore(fbApp)}
  const base=`trips/${code}`;
  const wrap=r=>({id:r.id,set:d=>F.setDoc(r,d),delete:()=>F.deleteDoc(r),onSnapshot:(n,e)=>F.onSnapshot(r,s=>n({id:s.id,exists:s.exists(),data:()=>s.data()}),e)});
  const fdb={doc:p=>wrap(F.doc(fs,base+"/"+p)),collection:p=>{const c=F.collection(fs,base+"/"+p);return{doc:()=>wrap(F.doc(c)),onSnapshot:(n,e)=>F.onSnapshot(c,s=>n({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))}),e)}}};
  // 先確認代碼可用
  await F.getDocFromServer(F.doc(fs,base+"/settings/rate")).catch(err=>{if(err&&err.code==="permission-denied")throw err});
  db=fdb;live=true;syncMsg="";
  // 把還沒共用前記在手機上的帳搬上去
  const locals=expenses.filter(x=>String(x.id).startsWith("l"));
  for(const x of locals){const {id,...rec}=x;try{await db.collection("expenses").doc().set(rec)}catch(_){}}
  if(locals.length){try{localStorage.removeItem("ngy:exp")}catch(_){}}
  db.collection("checks").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{n[d.id]=!!(d.data()||{}).done});done=n;store.set("done",done);if(tab!=="acct")refresh()},()=>{});
  db.collection("expenses").onSnapshot(snap=>{expenses=snap.docs.map(d=>{const v=d.data()||{};return{id:d.id,amt:+v.amt||0,cat:v.cat,who:v.who,split:v.split,day:v.day,note:v.note||"",ts:v.ts||0}});if(tab==="acct")renderAcct()},()=>{});
  db.doc("settings/rate").onSnapshot(s=>{if(s.exists){const v=+(s.data()||{}).jpyTwd;if(v>0){rate=v;store.set("rate",v);if(tab==="acct")renderAcct()}}},()=>{});
  rerenderData();
 }catch(err){
  if(err&&err.code==="permission-denied"){try{localStorage.removeItem(TRIP_KEY)}catch(_){};syncMsg="bad"}else syncMsg="offline";
  rerenderData();
 }finally{connecting=false}
}
addEventListener("online",()=>{if(!live){syncMsg="";connect()}});
connect();

/* ---------- 天氣：Open-Meteo 預報（免金鑰，約可預報 16 天） ---------- */
const LOC={"名古屋":[35.1709,136.8815],"長久手":[35.1702,137.0889],"犬山":[35.3883,136.9393],"常滑":[34.8866,136.832]};
const WMO=c=>c===0?["sun","晴"]:c<=2?["cloudsun","晴時多雲"]:c===3?["cloud","陰天"]:c<=48?["cloud","有霧"]:(c<=67||(c>=80&&c<=82))?["rain","有雨"]:(c<=77||c===85||c===86)?["cloud","下雪"]:["rain","雷雨"];
async function loadWeather(){
 const cached=store.get("wx");if(cached&&cached.days)forecast=cached;
 if(cached&&Date.now()-(cached.fetched||0)<3*3600e3)return;
 const names=Object.keys(LOC);
 try{
  const url="https://api.open-meteo.com/v1/forecast?latitude="+names.map(n=>LOC[n][0]).join(",")+"&longitude="+names.map(n=>LOC[n][1]).join(",")+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16";
  const r=await fetch(url);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
  const days={...((cached&&cached.days)||{})};let got=0;
  DAYS.forEach(x=>{const d=j[names.indexOf(x.wx[0])]?.daily;if(!d)return;const i=d.time.indexOf(`${YEAR}-${x.d.replace("/","-")}`);if(i<0)return;const[icon,desc]=WMO(d.weather_code[i]);days[x.d]={hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),icon,desc,pop:d.precipitation_probability_max[i]};got++});
  forecast={updated:new Date().toISOString(),fetched:Date.now(),days};store.set("wx",forecast);
  if(!got)return;
  if(tab==="wx")render(true);else if(tab==="plan"&&view==="day"){const b=document.getElementById("dayBody");if(b){b.innerHTML=dayBodyHTML();bindSched()}}
 }catch(_){}
}
loadWeather();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadWeather()});
</script>
