<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="看花花">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="11/17–11/24 名古屋 8 天行程、天氣、交通、記帳與清單">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>*,*::before,*::after{touch-action:manipulation}html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}
/* ===== 遊戲化首頁：粗外框、貼紙陰影、收藏卡片（先套用在首頁） ===== */
:root{--ol:#8C6D55;--butter:#F6D58A;--butter-soft:#FCEFC6;--pop:0 4px 0 var(--ol);--lift:0 3px 0 var(--ol)}
.g-home{--olw:2.5px;position:relative}

/* HUD */
.g-home .hud{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:2px}
.hud-badge{width:52px;height:52px;flex:none;border-radius:50%;background:var(--butter);border:var(--olw) solid var(--ol);box-shadow:0 3px 0 var(--ol);display:grid;place-items:center;overflow:hidden}
.hud-badge svg{width:46px;height:24px;margin-top:4px}
.hud-t h1{margin:0;font-size:22px;letter-spacing:.02em;line-height:1.15}
.hud-t small{display:block;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.hud-row{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;margin:10px 0 4px}
.hud-pill{position:relative;display:flex;align-items:center;gap:6px;min-width:0;height:38px;padding:0 10px 0 4px;border:var(--olw) solid var(--ol);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--ol);cursor:pointer;font:inherit;color:var(--ink);transition:transform .08s,box-shadow .08s}
.hud-pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.hp-ic{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ol)}
.hp-ic svg{width:16px;height:16px}
.hp-day .hp-ic{background:var(--butter);color:var(--ol)}
.hp-todo .hp-ic{background:var(--mint-soft);color:var(--mint-ink)}
.hp-yen .hp-ic{background:var(--coral-soft);color:var(--coral-ink)}
.hud-pill b{font-family:var(--f-display);font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
/* 主卡 */
.g-home .hero{border:2px solid var(--ol);border-radius:26px;box-shadow:var(--lift);margin-top:12px;overflow:visible}
.g-home .scene-wrap{position:relative;border-bottom:2px solid var(--ol);border-radius:24px 24px 0 0;overflow:hidden}
.g-home .hero .scene{border-radius:0}
.g-home .plaque{position:absolute;left:12px;top:10px;transform:rotate(-2deg);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border:2px solid var(--ol);border-radius:12px;box-shadow:0 2px 0 var(--ol);padding:3px 13px 4px;font-family:var(--f-display);font-weight:900;font-size:14px;color:var(--ink)}
.g-home .plaque::before,.g-home .plaque::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--butter);border:1.5px solid var(--ol)}
.g-home .plaque::before{left:4px}.g-home .plaque::after{right:4px}
.g-home .hero .body{padding:16px 18px 6px}
.g-home .hms span{background:var(--butter-soft);border-radius:12px}
.g-home .hms i{color:var(--brown)}
.g-home .hero .foot{padding:4px 18px 16px}
.g-home .chip.coral{box-shadow:inset 0 0 0 2px var(--coral-ink)}
/* 旅程進度 */
.trip-bar{padding:8px 18px 14px}
.tb-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--brown);margin-bottom:6px}
.tb-head b{font-weight:900;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.tb-seg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:3px;border:2px solid var(--ol);border-radius:10px;background:var(--sunk)}
.tb-seg i{height:12px;border-radius:5px;background:var(--card)}
.tb-seg i.on{background:var(--butter)}
.tb-seg i.now{background:repeating-linear-gradient(135deg,var(--butter) 0 5px,#F0C463 5px 10px);box-shadow:inset 0 0 0 1.5px var(--ol)}
.g-home .today-main{padding:14px 18px 4px}
.g-home .mood-line{border-top:2px dashed var(--line-strong)}
.g-home .trip-bar+.mood-line{margin-top:0}
/* 到期提醒 */
.g-home .due-alert{border:var(--olw) solid var(--ol);box-shadow:0 3px 0 var(--ol)}
.g-home .da-done{border:2px solid var(--ol);box-shadow:0 2px 0 var(--ol)}
.g-home .da-done:active{transform:translateY(2px);box-shadow:none}
/* 區塊卡片 */
.g-home .sheet{border:2px solid var(--ol);box-shadow:var(--lift);border-radius:26px;margin-top:30px}
.g-home .clips{top:-18px}
.g-home .sheet-head h2{font-size:20px}
/* 內層選項：不加外框，用底色區分（外層卡片才有粗外框） */
.g-home .grid{gap:10px 8px}
.g-home .tile{background:none;padding:0;gap:4px;transition:transform .08s}
.g-home .tile:active{transform:scale(.96)}
.g-home .tile .art{border-radius:16px}
.g-home .tile:active .art{transform:none}
.g-home .tile b{font-size:13.5px;line-height:1.25}
.g-home .tile small{margin-top:-4px}
.g-home .tile.today{background:none}
.g-home .tile.today .art{outline:3.5px solid var(--butter);outline-offset:2px}
.g-home .tile.today small{color:var(--ol)}
.g-home .tile.past{opacity:1}
.g-home .tile.past b,.g-home .tile.past small{color:var(--muted)}
.g-home .tile-pill{left:6px;top:6px}
.g-home .tile-done{box-shadow:none;background:var(--card)}
.g-home .ms-day{background:var(--sunk)}
.g-home .ms-day.today{background:var(--butter);box-shadow:none}
.g-home .ms-day.today small{color:var(--accent-deep)}
.g-home .rm-row{border:0;background:var(--sunk)}
.g-home .rm-row:active{transform:scale(.98)}
.g-home .rm-row.cal{background:var(--accent);border:var(--olw) solid var(--ol);box-shadow:0 3px 0 var(--ol)}
.g-home .rm-row.cal:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.g-home .rm-ic{background:var(--card)}
.g-home .rm-row.cal .rm-ic{background:rgba(255,255,255,.2)}

/* 浮動按鈕跟著首頁風格 */
@media (prefers-reduced-motion:reduce){.hud-pill,.g-home .tile,.g-home .rm-row{transition:none}}
</style>
<title>名古屋看花花</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 淺色手帳。首頁＝倒數卡（插畫＋左文字右大數字）＋ 8 天地點插畫格；點格子進入當日。底部 5 格分頁列，選中的那格換成彩色插畫圖示並浮出。
   單一淺色主題。類別色只用在標籤與記帳，介面本體只有棕＋薄荷。 */
:root{
  color-scheme:light;
  --paper:#F8F3EC; --card:#FFFFFF; --sunk:#F0E7DB; --line:#E3D6C4;
  --ink:#3F3127; --muted:#6E5E52; --brown:#82593A; --brown-soft:#E8D6C2; --line-strong:#CDB79F;
  --mint:#7CC8B4; --mint-soft:#DDF1EA; --mint-ink:#24695A;
  --accent:#946645; --accent-deep:#6B4730; --accent-soft:#F1E3D3;
  --st-now:#F4C04A; --st-now-soft:#FDF3D6; --st-next:var(--mint-ink); --st-next-glow:#B6E0D3;
  --shadow-float:0 10px 24px -10px rgba(63,49,39,.35);
  --coral-soft:#FDE6DC; --coral-line:#F0B49E; --coral-ink:#A64A2E; --sos-line:var(--coral-ink);
  --c-move-bg:#DCEBF7; --c-move:#2D5F8A;
  --c-go-bg:#DDF0E2;   --c-go:#2E6B45;
  --c-eat-bg:#FDE3D2;  --c-eat:#A24E1F;
  --c-stay-bg:#EBE2F6; --c-stay:#5E4590;
  --c-do-bg:#FBDDE6;   --c-do:#A33A5E;
  --c-buy-bg:#FBEFC8;  --c-buy:#7A5A06;
  --c-etc-bg:#ECE6DF;  --c-etc:#5E5248;
  --f-display:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --shadow:0 2px 0 var(--line);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
.shell{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 124px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;text-wrap:balance}

.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.bar .logo{width:66px;height:32px;flex:none}
.bar h1{font-size:20px;margin:0;letter-spacing:.02em}
.bar .back{position:relative;display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 8px;font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer}
.bar .back svg{width:20px;height:20px;color:var(--brown)}
.bar .right{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}

.hero{background:var(--card);border-radius:28px;overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--shadow);margin-top:6px}
.hero .scene{display:block;width:100%;height:auto;aspect-ratio:320/170}
.hero .body{padding:16px 20px 18px;display:flex;align-items:center;gap:12px}
.hero .txt{min-width:0;flex:1}
.hero .lbl{font-family:var(--f-display);font-weight:900;font-size:17px}
.hero .sub{font-size:14px;color:var(--muted);line-height:1.55;margin-top:2px}
.hero .big{flex:none;text-align:right;font-family:var(--f-display);font-weight:900;line-height:.85;font-size:72px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big small{display:block;font-size:14px;letter-spacing:0;color:var(--brown);margin-top:8px;line-height:1}
.hero .body.col{flex-direction:column;align-items:stretch;gap:12px}
.hero.trip .scene{aspect-ratio:320/150}
.today-main{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 20px 14px;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.today-main .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.today-main .lbl{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--brown)}
.today-main .ttl{font-family:var(--f-display);font-weight:900;font-size:23px;line-height:1.3}
.today-main .rt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-main .big{flex:none;text-align:right;font-family:var(--f-display);font-weight:900;line-height:.85;font-size:64px;letter-spacing:-.02em}
.today-main .big small{display:block;font-size:13px;letter-spacing:0;color:var(--brown);margin-top:8px;line-height:1}
.mood-line{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px 13px;border:0;border-top:2px dashed var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mood-line:active{background:var(--sunk)}
.mood-line .mc-faces{display:flex;flex:none}
.mood-line .mc-faces .face{width:26px;height:26px;margin-right:-6px}
.mood-line>.face{width:30px;height:30px;flex:none}
.mood-line .ml{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;margin-left:6px}
.mood-line b{font-family:var(--f-display);font-weight:900;font-size:15px;color:var(--brown)}
.mood-line small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-line .go{width:16px;height:16px;flex:none;color:var(--brown)}
.cd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cd-d{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:900;line-height:.85}
.cd-d b{font-size:72px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd-d small{font-size:20px;color:var(--brown)}
.hms{display:flex;gap:6px}
.hms span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px;background:var(--sunk);border-radius:12px;padding:8px 6px 6px;font-family:var(--f-display)}
.hms b{font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hms i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);line-height:1}
.hero .foot{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}

/* 外觀不變（使用者決定按鈕不加高），只把看不見的可點範圍放大到至少 44 高 */
.edit-btn::before{content:"";position:absolute;inset:-2px}
.chip::before,.sort-btn::before,.bar .back::before,.pick::before,.hud-pill::before,.leg a::before,.da-done::before,.linkbtn::before{content:"";position:absolute;left:0;right:0;top:50%;height:max(100%,44px);transform:translateY(-50%)}
.sort-btn{position:relative}
/* 類別選項會排成兩列：可點範圍只往上下各多 3px（列距的一半），不會點到隔壁那一列 */
[data-pick="cat"] .pick::before{height:calc(100% + 6px)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--sunk);color:var(--ink);border:0;text-decoration:none;cursor:pointer;transition:transform .12s}
.chip::after,.bar .back::after,.day-btn::after{content:"";position:absolute;inset:-6px -3px}
.chip:active{transform:scale(.95)}
.acts{row-gap:10px}
.chip svg{width:15px;height:15px;color:var(--brown)}
.chip.mint{background:var(--accent-soft);color:var(--brown)}
.chip.mint svg{color:var(--brown)}
.chip.coral{background:var(--coral-soft);color:var(--coral-ink);box-shadow:inset 0 0 0 1.5px var(--coral-line)}
.chip.coral svg{color:var(--coral-ink)}

.sheet{position:relative;background:var(--card);border-radius:28px;margin-top:26px;padding:22px 16px 18px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.clips{position:absolute;top:-12px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}
.clips i{position:relative;width:18px;height:36px}
/* 打孔：紙上的圓洞 */
.clips i::before{content:"";position:absolute;left:2px;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--sunk);border:2px solid var(--ol);box-sizing:border-box;box-shadow:inset 0 2px 0 rgba(140,109,85,.35)}
/* 線圈：從洞口繞出紙張上緣的完整圓環 */
.clips i::after{content:"";position:absolute;left:4px;top:0;width:10px;height:29px;border-radius:999px;border:3px solid var(--ol);border-bottom-color:transparent;box-sizing:border-box;background:none}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:20px}
.sheet-head span{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.tile{border:0;background:none;padding:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .art{width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;transition:transform .18s}
.tile:active .art{transform:scale(.95)}
.tile .art svg{display:block;width:100%;height:100%}
.tile b{font-family:var(--f-display);font-weight:900;font-size:14px;line-height:1.3}
.tile small{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted);margin-top:-3px;font-variant-numeric:tabular-nums}
.tile.past{opacity:.6}
.tile.today .art{outline:3px solid var(--mint);outline-offset:2px}

.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0 10px}
.days{display:flex;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:1 0 38px;border:0;background:none;border-radius:999px;padding:5px 0;cursor:pointer;font-family:var(--f-display);display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:background .2s}
.day-btn b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.day-btn small{font-size:11px;font-weight:700;color:var(--muted)}
.days{position:relative}
.days .ind{position:absolute;left:5px;top:5px;bottom:5px;border-radius:999px;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);transition:transform .34s cubic-bezier(.3,1.25,.5,1),width .34s;z-index:0}
.day-btn{position:relative;z-index:1}
.day-btn[aria-selected="true"] small,.day-btn[aria-selected="true"] b{color:var(--brown)}
.day-btn .dh{width:30px;height:24px;margin-top:-1px;animation:pop .25s ease}
.day-btn.today:not([aria-selected="true"]) b{color:var(--mint-ink)}

.banner{background:var(--card);border-radius:28px;border:1.5px solid var(--line);box-shadow:var(--shadow);padding:14px 16px 16px}
.banner .top{display:flex;gap:14px;align-items:center}
.banner .art{flex:none;width:108px;height:108px;border-radius:20px;overflow:hidden;display:block}
.banner .ttl{min-width:0}
.banner .when{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--brown)}
.banner h2{margin:2px 0 0;font-size:24px;line-height:1.25}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:6px;font-size:13px;color:var(--muted)}
.route svg{width:11px;height:11px;color:var(--brown)}
.wx{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.wx svg{width:34px;height:34px;flex:none}
.wx .temp{font-family:var(--f-display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx .temp span{font-size:15px;color:var(--muted)}
.wx .w-meta{font-size:13px;color:var(--muted);line-height:1.45;min-width:0}
.wx .w-meta b{color:var(--ink);font-weight:700}

.notes{display:flex;flex-direction:column;gap:12px;margin-top:14px}
/* 行程頁提醒：方格紙底＋珊瑚內框＋棕色外圈，跟一般卡片不同、比較顯眼；不傾斜，鈴鐺（淺珊瑚圓底）和文字同一排 */
.day-note{display:flex;gap:12px;align-items:center;margin:2px;padding:10px 14px 10px 10px;background:#FFFDF8;background-image:linear-gradient(rgba(148,102,69,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(148,102,69,.12) 1px,transparent 1px);background-size:16px 16px;border:2px solid var(--coral-line);border-radius:8px;box-shadow:0 0 0 2px var(--ol),0 8px 20px rgba(63,49,39,.18);font-size:15px;font-weight:700;line-height:1.45;color:var(--ink)}
.day-note .dn-ic{width:38px;height:38px;flex:none;border-radius:50%;background:var(--coral-soft);display:grid;place-items:center}
.day-note .dn-ic svg{width:20px;height:20px;color:var(--coral-ink)}
.day-note .dn-t{min-width:0}

.fab{position:fixed;z-index:9;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;max-width:min(240px,calc(100vw - 32px));padding:6px 16px 6px 6px;border:3px solid #fff;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 10px 24px -6px rgba(63,49,39,.38),0 0 0 1px var(--line);cursor:pointer;font:inherit;text-align:left;touch-action:manipulation}
.fab[hidden]{display:none}
.fab.in{animation:fabin .38s cubic-bezier(.3,1.4,.5,1)}
.fab:active{transform:scale(.96)}
.fab .fh{width:42px;height:42px;flex:none;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.fab .fh svg{width:36px;height:30px;margin-top:6px}
.fab .ft{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.fab small{font-size:12px;font-weight:700;color:var(--mint-ink)}

body.has-fab .shell{padding-bottom:190px}
@keyframes fabin{from{opacity:0;transform:translateY(12px) scale(.85)}to{opacity:1;transform:none}}
/* 遊戲風外框（要寫在基本樣式之後才會蓋過白框） */
.fab{border:2.5px solid var(--ol);box-shadow:0 4px 0 var(--ol)}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ol)}
.fab .fh{border:2px solid var(--ol);background:var(--butter)}
/* 回家：焦糖棕字，房子圖示，右側箭頭表示會開地圖 */
.fab.home small{color:var(--accent)}
.fab.home .fh .hs{width:30px;height:30px;margin:0}
.fab.home{padding-right:10px}
.fab .go{width:18px;height:18px;flex:none;color:var(--accent);margin-left:2px}
/* 光波：從按鈕外緣慢慢往外擴散、淡出，提醒「這裡可以點」 */
.fab::before,.fab::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:3px solid var(--ol);pointer-events:none;opacity:0}
.fab.pulse::before,.fab.pulse::after{animation:fabwave 2.8s ease-out infinite}
.fab.pulse::after{animation-delay:1.4s}
@keyframes fabwave{0%{transform:scale(1);opacity:.7}70%{opacity:0}100%{transform:scale(1.14,1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.fab.in{animation:none}.fab::before,.fab::after{animation:none;display:none}}

.st-page .st-big small{font-size:22px;margin-left:4px}
.st-page p{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
.st-hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:.8}
.st-tap{position:absolute;z-index:2;top:0;bottom:0;width:34%;border:0;background:none;padding:0;cursor:pointer}
.st-tap.prev{left:0}.st-tap.next{right:0;width:66%}
.st-page .st-act{position:relative;z-index:3}
/* 紙本物件共用 */
.st-page{justify-content:safe center;overflow-y:auto;overscroll-behavior:contain}
.tape{position:absolute;width:86px;height:24px;background:rgba(246,213,138,.78);box-shadow:0 1px 2px rgba(63,49,39,.15);z-index:2}
.tape.mint{background:rgba(124,200,180,.7)}.tape.coral{background:rgba(238,148,121,.62)}
.st-cap{font-size:13.5px;color:var(--muted);margin:0}
/* 1 登機證 */
.pg-open{background:#F6D58A;background-image:radial-gradient(rgba(255,255,255,.55) 1.5px,transparent 1.6px);background-size:16px 16px}
.bpass{position:relative;display:flex;width:100%;max-width:360px;background:#FFFDF8;border:2.5px solid var(--ol);border-radius:20px;box-shadow:0 5px 0 var(--ol);transform:rotate(-2deg);text-align:left}
.bp-main{flex:1;padding:16px 14px 14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bp-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.bp-top b{font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:14px}
.bp-route{display:flex;align-items:center;gap:8px}
.bp-route span{display:flex;flex-direction:column;line-height:1.05}
.bp-route b{font-family:var(--f-display);font-weight:900;font-size:32px}
.bp-route small{font-size:12.5px;color:var(--muted);font-weight:700}
.bp-route svg{flex:1;height:22px;min-width:24px}
.bp-meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;border-top:2px dashed var(--line);padding-top:9px}
.bp-meta div{display:flex;flex-direction:column;line-height:1.3}
.bp-meta small{font-size:11px;color:var(--muted);font-weight:700}
.bp-meta b{font-family:var(--f-display);font-weight:900;font-size:15px}
.bp-stub{position:relative;width:88px;flex:none;border-left:2.5px dashed var(--ol);background:var(--butter-soft);border-radius:0 18px 18px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px;overflow:hidden}
.bp-stub::before,.bp-stub::after{content:"";position:absolute;left:-12px;width:20px;height:20px;border-radius:50%;background:#F6D58A;border:2.5px solid var(--ol)}
.bp-stub::before{top:-12px}.bp-stub::after{bottom:-12px}
.bp-stub svg{width:80px;height:48px}
.bp-stub small{font-family:var(--f-display);font-weight:900;font-size:12px;color:var(--brown)}
.pg-open h2{font-size:28px;margin-top:6px}
/* 2 護照入境章：整頁護照內頁，戳章兩欄交錯 */
.pg-stamp{background:#E7DCCB;justify-content:stretch;padding-left:16px;padding-right:16px}
.passport{position:relative;flex:1;width:100%;max-width:400px;min-height:0;display:flex;flex-direction:column;gap:10px;padding:16px 18px 14px;background:#FBF6EC;background-image:repeating-radial-gradient(circle at 50% 115%,transparent 0 13px,rgba(148,102,69,.06) 13px 14px),repeating-radial-gradient(circle at 0 0,transparent 0 22px,rgba(36,105,90,.04) 22px 23px);border:2.5px solid var(--ol);border-radius:18px;box-shadow:0 5px 0 var(--ol);text-align:left}
.pp-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:900;font-size:16px;color:var(--brown);border-bottom:2px solid var(--line-strong);padding-bottom:8px}
.pp-head small{font-size:12.5px;color:var(--muted)}
.stamps{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);column-gap:14px;padding-bottom:44px}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;color:var(--ink-c)}
.stamp:nth-child(even){transform:translateY(34%)}
.stamp .sc{position:relative;flex:1 1 0;height:0;max-height:min(30vw,96px);width:auto;aspect-ratio:1;min-height:0;padding:5px;border:3px solid var(--ink-c);border-radius:50%;background:rgba(255,255,255,.5);opacity:0;transform:scale(1.7) rotate(var(--r));transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;mix-blend-mode:multiply}
.stamp.sq .sc{border-radius:14px;border-style:double;border-width:5px}
.stamp .sc>svg{width:100%;height:100%;display:block;border-radius:inherit;opacity:.88}
.stamp .sl{font-family:var(--f-display);font-weight:900;font-size:12.5px;line-height:1.2;text-align:center;opacity:0;transform:rotate(calc(var(--r) * .5));transition:opacity .2s;white-space:nowrap}
.stamp .sl small{display:block;font-size:11px;opacity:.8}
.pg-stamp.on .stamp .sc{opacity:1;transform:scale(1) rotate(var(--r));transition-delay:var(--d)}
.pg-stamp.on .stamp .sl{opacity:1;transition-delay:var(--d)}
.pp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:2px dashed var(--line-strong);padding-top:10px}
.pp-sum{font-size:15px;font-weight:700;color:var(--muted);line-height:1.2}
.pp-sum b{font-family:var(--f-display);font-weight:900;font-size:48px;color:var(--coral-ink);margin:0 4px;font-variant-numeric:tabular-nums}
.pp-no{font-family:var(--f-display);font-weight:900;font-size:12px;color:var(--muted)}
@media (max-height:640px){.stamp .sl small{display:none}.pp-sum b{font-size:36px}.stamps{padding-bottom:30px}}
/* 3 方格筆記本 */
.pg-mood{background:#EBE2F6}
.pg-mood .note{position:relative;width:100%;max-width:370px;padding:22px 16px 16px;background:#FFFDF8;background-image:linear-gradient(rgba(148,102,69,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(148,102,69,.12) 1px,transparent 1px);background-size:16px 16px;border-radius:6px;box-shadow:0 8px 20px rgba(63,49,39,.18),0 0 0 2px var(--ol);transform:rotate(1.5deg);display:flex;flex-direction:column;gap:10px}
.pg-mood .note .tape{top:-10px}.pg-mood .note .tape.l{left:-14px;transform:rotate(-32deg)}.pg-mood .note .tape.r{right:-14px;transform:rotate(30deg)}
.pg-mood .note h2{font-size:22px;text-align:left}
.curve{position:relative;width:100%;aspect-ratio:16/10}
.curve svg.ln{position:absolute;inset:18px 18px 26px;width:calc(100% - 36px);height:calc(100% - 44px);overflow:visible}
.curve svg.ln path{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .6s ease .2s}
.pg-mood.on .curve svg.ln path{opacity:1}
.curve .pt{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;box-shadow:0 0 0 3px var(--pc);background:var(--card);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.curve .pt .face{width:30px;height:30px;display:block}
.pg-mood.on .curve .pt{opacity:1;transform:none;transition-delay:var(--d)}
.curve .dx{position:absolute;bottom:2px;font-size:11px;font-weight:700;color:var(--muted);transform:translateX(-50%)}
.mood-leg{display:flex;gap:10px;justify-content:flex-start}
.mood-leg span{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 2px var(--pc);font-size:13px;font-weight:700}
.mood-leg svg{width:24px;height:20px}
/* 4 拍立得 */
.pg-best{background:#DDF0E2;background-image:radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.1px);background-size:22px 22px}
.pol-wrap{position:relative}
.polaroid{position:relative;width:min(250px,68vw);padding:12px 12px 14px;background:#fff;border-radius:4px;box-shadow:0 12px 26px rgba(63,49,39,.25),0 0 0 2px var(--ol);transform:rotate(-4deg)}
.polaroid .tape{top:-12px;left:50%;margin-left:-43px;transform:rotate(3deg)}
.polaroid>svg{width:100%;aspect-ratio:1;display:block;border-radius:2px}
.polaroid b{display:block;margin-top:10px;font-family:var(--f-display);font-weight:900;font-size:18px}
.polaroid small{font-size:12.5px;color:var(--muted)}
.doodle{position:absolute;pointer-events:none}
.doodle.d1{left:-34px;top:20px;width:34px}.doodle.d2{right:-30px;top:-6px;width:30px}.doodle.d3{right:-24px;bottom:30px;width:28px}
.bubbles{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.bub{display:flex;align-items:flex-end;gap:8px;text-align:left}
.bub.r{flex-direction:row-reverse;text-align:right}
.bub>svg{width:46px;height:38px;flex:none}
.bub span{position:relative;padding:9px 13px;background:var(--card);border:2.5px solid var(--ol);border-radius:16px 16px 16px 4px;font-size:14.5px;font-weight:700;line-height:1.45}
.bub.r span{border-radius:16px 16px 4px 16px}
/* 5 角色卡 */
.pg-vs{background:#3F3127;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px);color:#fff}
.pg-vs h2{color:#F6D58A}
.vs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:370px}
.vs-p{display:flex;flex-direction:column;align-items:stretch;background:#FFFDF8;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2.5px var(--ol),0 6px 0 rgba(0,0,0,.35);overflow:hidden;color:var(--ink);transform:rotate(var(--r))}
.vs-p .vh{background:var(--pc);color:#fff;font-family:var(--f-display);font-weight:900;font-size:17px;padding:6px 0;text-align:center}
.vs-p .vp{margin:10px auto 4px;width:76px;height:76px;border-radius:50%;background:var(--butter-soft);box-shadow:inset 0 0 0 2.5px var(--ol);display:grid;place-items:center}
.vs-p .vp svg{width:58px;height:68px;margin-top:4px}
.vs-row{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:5px 12px;border-top:2px dashed var(--line);font-size:12px;color:var(--muted);font-weight:700}
.vs-row em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.vs-mid{position:absolute;left:50%;top:44%;width:66px;height:66px;margin:-33px 0 0 -33px;z-index:2}
.vs-bar{width:100%;max-width:370px;display:flex;flex-direction:column;gap:6px}
.vs-bar .bt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:#F6D58A}
.vs-bar .bb{display:flex;height:14px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px #fff}
.vs-bar .bb i{display:block;height:100%}
/* 6 收據 */
.pg-rcpt{background:#E7DCCB;background-image:linear-gradient(90deg,rgba(148,102,69,.06) 50%,transparent 50%);background-size:28px 28px}
.rcpt-wrap{position:relative;width:100%;max-width:330px;overflow:hidden;padding-bottom:14px}
.rcpt{position:relative;background:#FFFDF8;padding:22px 20px 22px;text-align:left;font-variant-numeric:tabular-nums;transform:translateY(-100%);transition:transform 1s cubic-bezier(.3,.8,.4,1) .15s;box-shadow:0 6px 18px rgba(63,49,39,.18)}
.pg-rcpt.on .rcpt{transform:none}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:conic-gradient(from -45deg at 50% 100%,#FFFDF8 90deg,transparent 0) 0 0/16px 10px repeat-x}
.rcpt h3{margin:0;text-align:center;font-size:17px;letter-spacing:.08em}
.rcpt .rc-sub{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 12px}
.rcpt .rl{display:flex;align-items:baseline;gap:6px;font-size:14.5px;padding:4px 0}
.rcpt .rl span{flex:none}
.rcpt .rl i{flex:1;border-bottom:2px dotted var(--line-strong);transform:translateY(-4px)}
.rcpt .rl b{flex:none;font-family:var(--f-display);font-weight:900}
.rcpt hr{border:0;border-top:2px dashed var(--line-strong);margin:10px 0}
.rcpt .tot b{font-size:22px}
.rcpt .tot span{font-weight:900}
.rcpt .rc-tw{text-align:right;font-size:12.5px;color:var(--muted)}
.rcpt .rc-settle{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700}
.rcpt .rc-thx{margin-top:18px;min-height:66px;display:flex;align-items:center;text-align:left;font-family:var(--f-display);font-weight:900;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.paid{position:absolute;right:16px;bottom:16px;width:78px;height:78px;border:3.5px solid var(--coral-ink);border-radius:50%;color:var(--coral-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg) scale(1.6);opacity:0;transition:transform .3s cubic-bezier(.3,1.6,.5,1) 1.2s,opacity .2s 1.2s;mix-blend-mode:multiply}
.paid svg{width:30px;height:30px}
.paid b{font-family:var(--f-display);font-weight:900;font-size:15px}
.pg-rcpt.on .paid{transform:rotate(-14deg);opacity:.9}
/* 7 旅行檔案卡 */
.pg-sum{background:#FCEFC6;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 26px,transparent 26px 52px);justify-content:safe center}
.dossier{position:relative;width:100%;max-width:360px;margin-top:6px}
.dossier::before{content:"";position:absolute;inset:6px -6px -8px 8px;background:#F8DCC6;border:2.5px solid var(--ol);border-radius:22px;transform:rotate(2.5deg)}
.ds-card{position:relative;background:#FFF6E6;border:2.5px solid var(--ol);border-radius:22px;box-shadow:0 5px 0 var(--ol);padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left}
.ds-clip{position:absolute;right:22px;top:-22px;width:30px;height:62px;z-index:3}
.ds-top{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start}
.ds-photo{width:104px;height:104px;border-radius:14px;border:2.5px solid var(--ol);background:linear-gradient(160deg,#EE9479,#F6D58A);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.ds-photo svg{width:112px;height:68px;margin-bottom:-2px}
.ds-name{background:#FFFDF8;border:2px solid var(--line-strong);border-radius:14px;padding:8px 10px;text-align:center}
.ds-name small{display:block;font-size:12px;font-weight:700;color:var(--brown)}
.ds-name b{display:block;font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.25;color:var(--accent-deep)}
.ds-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.ds-tags>small{font-size:12px;font-weight:900;color:var(--brown);margin-right:2px}
.ds-tags span{padding:3px 9px;border-radius:999px;background:#F8DCC6;font-size:12px;font-weight:900;color:var(--accent-deep)}
.ds-sec{background:#FFFDF8;border:2px solid var(--line-strong);border-radius:14px;overflow:hidden}
.ds-sec h3{margin:0;padding:6px 12px;background:#F8E3BE;font-size:13.5px;color:var(--brown)}
.ds-sec ul{list-style:none;margin:0;padding:2px 12px}
.ds-sec li{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1.5px dashed var(--line);font-size:14px;line-height:1.35}
.ds-sec li:first-child{border-top:0}
.ds-sec li svg{width:14px;height:14px;flex:none}
.ds-says{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ds-say{position:relative;background:#FFFDF8;border:2px solid var(--line-strong);border-radius:14px;overflow:visible;min-width:0}
.ds-say h4{margin:0;padding:5px 10px;background:#F8E3BE;border-radius:12px 12px 0 0;font-size:12.5px;color:var(--brown)}
.ds-say p{margin:0;padding:8px 32px 10px 10px;font-size:13px;line-height:1.45;font-weight:700;color:var(--ink);min-height:3em}
.ds-say .av{position:absolute;right:-6px;top:-16px;width:44px;height:37px}
.ds-say .mf{position:absolute;right:6px;bottom:6px;width:24px;height:24px}
.ds-say .mf .face{width:24px;height:24px}
.sum-acts{display:flex;gap:10px;width:100%;max-width:360px}
.sum-acts button{flex:1;height:48px;border:0;border-radius:15px;font:inherit;font-family:var(--f-display);font-weight:900;font-size:15px;cursor:pointer}
.sum-acts .save{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep)}
.sum-acts .again{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-strong)}
.st-msg{font-size:13px;color:var(--brown);font-weight:700;min-height:1em}
@media (prefers-reduced-motion:reduce){.st-page,.stamp .sc,.curve .pt,.rcpt,.curve svg.ln path,.paid,.stamp .sl{transition:none!important}.stamp .sc{opacity:1;transform:rotate(var(--r))}.curve .pt{opacity:1;transform:none}.rcpt{transform:none}.curve svg.ln path{opacity:1}.stamp .sl{opacity:1}.paid{opacity:.9;transform:rotate(-14deg)}}

/* ===== 匯率自動更新 ===== */
.rate-note{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.4}
.rate-note a{color:var(--muted)}
.rate-note.err{color:var(--coral-ink);font-weight:700}
.rate-note button{flex:none;border:0;border-radius:10px;background:var(--sunk);color:var(--brown);font:inherit;font-family:var(--f-display);font-weight:900;font-size:12.5px;padding:6px 10px;cursor:pointer}
.rate-note .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:5px;vertical-align:1px}
/* ===== 窄螢幕與 200% 縮放（放在最後，蓋過前面的一般設定） ===== */
/* 金額很大或螢幕很窄時：總額字級跟著縮，誰付多少換到下一行，不會撐破 */
.sum{flex-wrap:wrap}.sum>div:first-child{min-width:0}.sum .r{margin-left:auto}
.sum .v{font-size:clamp(26px,10vw,36px);overflow-wrap:anywhere}
@media (max-width:400px){.ex .a{font-size:15px}.ex{gap:8px}}
/* 記帳標題列：窄螢幕不放貓頭、標題不換行、錢包膠囊不超出畫面 */
.bar h1{white-space:nowrap}
.bar-r{flex-shrink:1}
.bar-r .wchip{min-width:0}
@media (max-width:400px){.bar:has(.bar-r) .logo{display:none}}
@media (max-width:360px){.wchip small{display:none}.wchip{padding-right:10px}}
/* 200% 縮放（約 195px 寬）：所有標題列的同步只留燈號，各頁的格子可以縮或換行，不會出現左右捲動 */
@media (max-width:240px){.bar .sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.bar .sync{position:relative;flex:none;width:44px;height:44px;padding:0;justify-content:center}
 .faces{grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}.fbtn{min-width:0}.fbtn svg{width:100%;height:auto;max-width:44px}.fbtn small{font-size:11px}
 .wxrow{grid-template-columns:44px 28px minmax(0,1fr);gap:6px}.wxrow .t{grid-column:2/-1;white-space:normal}
 .pass .row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px}.pass .ap{font-size:22px;min-width:0}.pass .ap small{font-size:11px;overflow-wrap:anywhere}
 .pe-row{flex-wrap:wrap}
 nav.tabs .in button[aria-selected="true"]::after{width:min(44px,100%)}
 .hud-sos,.bar-sos{width:44px;padding:0;justify-content:center}.hud-sos b,.bar-sos b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .pack-sum{gap:8px;padding:10px}.pack-sum .pe-art{width:48px;height:40px}.pt-toggle{max-width:100%;min-width:0}.bar:has(.bar-r){flex-wrap:wrap;row-gap:8px}.bar:has(.bar-r) .bar-r{width:100%;justify-content:flex-end}
 .rate{flex-wrap:wrap;row-gap:6px;white-space:nowrap}}
</style>

<script>
/* ---------- 角色：白貓「豆花」、黑貓「芝麻」（粗外框、平塗、大圓眼的站姿 Q 版） ---------- */
const LN="#2B2420";
/* 手繪感：深色粗線＋輕微抖動；頭大身小、尖耳、短胖手腳、大白眼斜看、只有小鼻子 */
document.getElementById("defs").insertAdjacentHTML("beforeend",`<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>`);
function headM(o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const look=o.look||2.4;
 const eye=o.eyes==="happy"?(x)=>`<path d="M${x-5.5} 27 Q${x} 19.5 ${x+5.5} 27" fill="none" stroke="${LN}" stroke-width="3.2" stroke-linecap="round"/>`
  :o.eyes==="sleep"?(x)=>`<path d="M${x-5.5} 25 Q${x} 30.5 ${x+5.5} 25" fill="none" stroke="${LN}" stroke-width="3.2" stroke-linecap="round"/>`
  :(x)=>`<ellipse cx="${x}" cy="25" rx="7" ry="6.6" fill="#fff" ${s}/><circle class="pupil" cx="${x+look}" cy="25.6" r="3.4" fill="${LN}"/>`;
 return `<path d="M15 40 C9 32 10 20 13.5 11 L17.5 1.5 L29.5 12.5 Q35 10.8 40.5 12.5 L52.5 1.5 L56.5 11 C60 20 61 32 55 40 C49 45.5 21 45.5 15 40 Z" fill="${o.fur}" ${s}/>
  <g class="eyes">${eye(27)}${eye(43)}</g>
  <circle cx="${35+look*.5}" cy="33" r="1.8" fill="${o.nose}"/>
  <path d="M13 29 H6.5 M13.5 33.5 L7.5 35.5 M57 29 H63.5 M56.5 33.5 L62.5 35.5" stroke="${o.whisk||LN}" stroke-width="2.2" stroke-linecap="round"/>`;
}
/* 側面往左走：頭轉側面（鼻子在左前方、雙耳偏後）、身體橫向，前腳往左前伸、後腳往右後蹬 */
function walkSym(id,o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const dbl=(d)=>`<path d="${d}" fill="none" stroke="${LN}" stroke-width="9.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.fur}" stroke-width="3.3" stroke-linecap="round"/>`;
 const eye=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" ${s}/><circle cx="${x-rx*.38}" cy="${y+.6}" r="${ry*.52}" fill="${LN}"/>`;
 return `<symbol id="${id}" viewBox="-4 -6 78 88"><g filter="url(#rough)" transform="rotate(-3 35 70)">
  <ellipse cx="35" cy="75" rx="28" ry="2.6" fill="#000" opacity=".1"/>
  ${dbl("M57 58 Q68 58 67 46")}
  <path d="M47 49 C52 48 56.5 49 57.5 52.5 C58 55.5 55 56.8 52.5 55.2" fill="${o.fur}" ${s}/>
  <path d="M22 43 C16 47 14 53 15 58 C11 60 7 63 7.5 67.5 C8 71.5 13 72.5 17 70.5 C20 69 23 67 25.5 65.5 Q36 63 46 65.5 C49 68 52 71.5 56.5 72 C61 72.3 63.5 68.5 61.5 64.5 C60 61 57.5 58.5 56 56.5 C57 50 54 44 48 42 Z" fill="${o.fur}" ${s}/>
  <path d="M24 48.5 C18.5 47.5 13.5 47.5 11.8 50.6 C10.6 53.6 13 56.6 16.2 56 C19 55.4 21.8 54.8 24 54.6" fill="${o.fur}" ${s}/>
  <path d="M22.5 41 Q34 47.5 47.5 40.5 L48.5 46 Q35 53 22 46.5 Z" fill="${o.scarf}" ${s} stroke-width="2.6"/>
  <circle cx="27" cy="50" r="3" fill="#F4C04A" ${s} stroke-width="2.4"/>
  <path d="M10 30 C9 22 14 14 21 11.5 L26 2.5 L33.5 10.5 Q38 10 42 11 L48.5 2.5 L51 13.5 C57.5 18 59.5 28 56 35 C52 43 40 45.8 28 45.4 C16 45 10.5 39 10 30 Z" fill="${o.fur}" ${s}/>
  ${eye(19.5,25,5.4,6.2)}${eye(32,24.5,6.6,6.8)}
  <circle cx="11.2" cy="31.5" r="2" fill="${o.nose}"/>
  <path d="M14 34.5 L6 33.5 M14.5 37.5 L7.5 39.5" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>
 </g></symbol>`;
}
function catSym(id,o){return `<symbol id="${id}" viewBox="-4 -6 78 88">${catInner(o)}</symbol>`}
function catInner(o){
 const s=`stroke="${LN}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
 const dbl=(d)=>`<path d="${d}" fill="none" stroke="${LN}" stroke-width="9.5" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.fur}" stroke-width="3.3" stroke-linecap="round"/>`;
 let bodyPart;
 if(o.walk){
  /* 參考圖比例：身體圓胖、手腳又短又粗；短手往前後平伸，短腿一前一後成大步 */
  bodyPart=`${dbl("M17 58 Q5 58 5.5 47")}
  <path d="M21 42 C17 48 15 54 15 59 C11 61 8 65 9 69 C10 73 15 74.5 19.5 72.5 C22.5 71 25 68.5 27.5 66.5 Q35 63.5 42.5 66.5 C46 69.5 50 72.5 54.5 73 C59.5 73.2 63 69.5 61 65 C59 61.5 56 59 54 58 C54 53 52 47 49 42 Z" fill="${o.fur}" ${s}/>
  <path d="M20.5 47.5 C15 46.5 10.5 46.5 8.8 49.6 C7.6 52.6 10 55.6 13.2 55 C16 54.4 18.8 53.8 21 53.6" fill="${o.fur}" ${s}/>
  <path d="M48.5 47.5 C54 46 58.5 46 60.4 49.2 C61.8 52.2 59.4 55.4 56.2 54.9 C53.4 54.4 50.6 53.8 48.6 53.6" fill="${o.fur}" ${s}/>`;
 }else{
  const armR=o.wave?`<g class="arm">${dbl("M47 50 Q55 47 57 37")}</g>`:o.eat?"":`<path d="M47 51 Q54 56 52 62 Q48 64 45 59" fill="${o.fur}" ${s}/>`;
  bodyPart=`<g class="tail${o.tailL?" l":""}">${dbl(o.tailL?"M19 66 Q4 65 7 49":"M51 66 Q66 65 63 49")}</g>
  <path d="M22 42 C19 52 18 61 20 67 Q35 71 50 67 C52 61 51 52 48 42 Z" fill="${o.fur}" ${s}/>
  <path d="M21.5 63 C17 66 17 74 22.5 75.5 C27.5 76.8 31.5 73.5 32 68.5" fill="${o.fur}" ${s}/><path d="M48.5 63 C53 66 53 74 47.5 75.5 C42.5 76.8 38.5 73.5 38 68.5" fill="${o.fur}" ${s}/>
  <path d="M21.5 72.5 v-2 M25.5 74 v-2 M48.5 72.5 v-2 M44.5 74 v-2" stroke="${LN}" stroke-width="1.8" stroke-linecap="round"/>
  ${o.eat?"":`<path d="M23 51 Q16 56 18 62 Q22 64 25 59" fill="${o.fur}" ${s}/>`}${armR}`;
 }
 return `<g filter="url(#rough)"${o.walk?` transform="rotate(3 35 70)"`:""}${o.anim?` class="anim ${o.anim}"`:""}>
  <ellipse cx="36" cy="${o.walk?75:77}" rx="${o.walk?27:25}" ry="2.6" fill="#000" opacity=".1"/>
  ${bodyPart}
  <path d="M21.5 41 Q35 47 48.5 41 L49 46.5 Q35 52.5 21 46.5 Z" fill="${o.scarf}" ${s} stroke-width="2.6"/>
  <circle cx="35" cy="50.5" r="3" fill="#F4C04A" ${s} stroke-width="2.4"/>
  ${headM(o)}
  ${o.eat?FOOD[o.eat](s)+`<path d="M22 50 Q20 57 29 57.5" fill="${o.fur}" ${s}/><path d="M48 50 Q50 57 41 57.5" fill="${o.fur}" ${s}/>`:""}
 </g>`;
}

/* ---------- 地圖檢視器：點開全螢幕，雙指縮放、拖曳、點兩下放大 ---------- */
function openViewer(src,alt){
 const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-label",alt);
 v.innerHTML=`<img src="${src}" alt="${esc(alt)}" draggable="false"><button class="vclose" type="button" aria-label="關閉地圖"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  <div class="vtools"><button type="button" data-z="-1" aria-label="縮小">－</button><button type="button" data-z="0" aria-label="還原">還原</button><button type="button" data-z="1" aria-label="放大">＋</button></div><div class="vhint">雙指縮放・點兩下放大</div>`;
 document.body.appendChild(v);document.body.style.overflow="hidden";
 const img=v.querySelector("img");let s=1,x=0,y=0,size=0;
 const vw=()=>v.clientWidth,vh=()=>v.clientHeight;
 const clamp=()=>{const w=size*s;x=w<=vw()?(vw()-w)/2:Math.min(0,Math.max(vw()-w,x));y=w<=vh()?(vh()-w)/2:Math.min(0,Math.max(vh()-w,y))};
 const apply=(anim)=>{clamp();img.style.transition=anim&&!reduce()?"transform .25s cubic-bezier(.2,.8,.2,1)":"none";img.style.transform=`translate(${x}px,${y}px) scale(${s})`};
 const fit=()=>{size=Math.min(vw(),vh()-140);img.style.width=img.style.height=size+"px";s=1;x=(vw()-size)/2;y=(vh()-size)/2;apply(false)};
 const zoomAt=(px,py,ns,anim)=>{ns=Math.max(1,Math.min(4,ns));x=px-(px-x)*(ns/s);y=py-(py-y)*(ns/s);s=ns;apply(anim)};
 fit();addEventListener("resize",fit);
 const pts=new Map();let last=null,tap=null;
 v.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;v.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null;if(pts.size===1)tap={x:e.clientX,y:e.clientY,t:Date.now(),moved:false}});
 v.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap.moved=true;
  if(pts.size===1){if(s>1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;apply(false)}}
  else if(pts.size===2){const [a,b]=[...pts.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y);if(last){x+=mx-last.mx;y+=my-last.my;zoomAt(mx,my,s*d/last.d,false)}last={mx,my,d}}});
 let lastTap=0;
 const up=e=>{pts.delete(e.pointerId);last=null;if(pts.size===0&&tap&&!tap.moved&&Date.now()-tap.t<300){const now=Date.now();if(now-lastTap<320){zoomAt(tap.x,tap.y,s>1.2?1:2.5,true);lastTap=0}else lastTap=now}if(pts.size===0)tap=null};
 v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
 v.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,s*(e.deltaY<0?1.15:1/1.15),false)},{passive:false});
 v.querySelector(".vtools").addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(!b)return;const z=+b.dataset.z;if(z===0)zoomAt(vw()/2,vh()/2,1,true);else zoomAt(vw()/2,vh()/2,s*(z>0?1.6:1/1.6),true)});
 /* 關閉時立刻移除（不留淡出中的舊畫面），Esc 和焦點交給共用的面板處理 */
 const close=modal(v,()=>{removeEventListener("resize",fit);document.body.style.overflow="";v.remove()},".vclose");
 v.querySelector(".vclose").addEventListener("click",close);
}
let pendingDel=null,editingId=null,editBase=null,lastSave=0;
/* 新帳的預設值：自己付、兩人平分、付現、今天。修改完舊帳或取消修改後都回到這裡，不沿用舊帳 */
const freshDraft=()=>({amt:"",cat:"food",who:me||"",split:"both",pay:"cash",day:todayIdx>=0?DAYS[todayIdx].d:"11/17",note:"",tf:false});
/* 一筆帳在表單裡的樣子（用來比對哪些欄位被改過） */
const expForm=e=>({amt:+e.amt||0,cat:e.cat||"etc",who:e.who||"zhang",split:e.split||"both",pay:e.pay||"card",day:e.day||"11/17",note:e.note||"",tf:!!e.tf});
const draftVal=k=>k==="amt"?(parseYen(draft.amt).v||0):k==="tf"?!!draft.tf:k==="note"?draft.note.trim():draft[k];
function startEdit(id){
 const e=expenses.find(x=>x.id===id);if(!e)return;editingId=id;pendingDel=null;editBase=expForm(e);
 draft={...editBase,amt:String(e.amt)};
 render(true);
 document.getElementById("acct-form").scrollIntoView({block:"start",behavior:reduce()?"auto":"smooth"});
 document.getElementById("f-msg").textContent="正在修改這筆，改好後按「更新這筆」";
}
function stopEdit(){editingId=null;editBase=null;draft=freshDraft();render(true)}
/* 對方的快照進來時，正在修改的那筆：被刪掉就退出修改；被改過就把自己沒動的欄位換成最新內容 */
function editSync(){
 if(!editingId)return "";
 const cur=expenses.find(x=>x.id===editingId);
 if(!cur){editingId=null;editBase=null;draft=freshDraft();return "對方刪掉了這筆帳，已取消修改"}
 if(!editBase)return "";
 const nb=expForm(cur);let changed=false;
 for(const k of Object.keys(nb)){if(nb[k]!==editBase[k]){changed=true;if(draftVal(k)===editBase[k])draft[k]=k==="amt"?String(nb[k]):nb[k]}}
 if(!changed)return "";editBase=nb;return "對方剛改過這筆，已帶入最新內容";
}

async function checkReminders(){

/* 首頁右下的「現在行程」浮動按鈕：旅程中才出現，點了跳到當天正在進行的行程 */
function curItem(x){
 const st=dayStatus(x),nowM=st.nowM;let last=-1;
 x.items.forEach((it,i)=>{const m=itemM(it);if(m!=null&&m<=nowM)last=i});
 if(last>=0&&st.st[last]==="now")return{i:last,lbl:"現在"};
 const j=last+1;if(j>=x.items.length)return null;
 const it=x.items[j];if(!it.t)return{i:j,lbl:"現在"};
 /* 下一個有時間的行程還早（超過 1 小時），就還算在上一個行程裡，例如整天在吉卜力公園 */
 if(last>=0&&itemM(it)-nowM>60)return{i:last,lbl:"現在"};
 return{i:j,lbl:`接下來 ${it.t}`};
}

function dayOver(i){

 const st=dayStatus(x);return st.nowM>=22*60&&st.next<0&&!st.st.includes("now");
}

/* ---------- 天氣：Open-Meteo 預報（免金鑰，約可預報 16 天） ---------- */
const LOC={"名古屋":[35.1709,136.8815],"長久手":[35.1702,137.0889],"犬山":[35.3883,136.9393],"常滑":[34.8866,136.832]};
const WMO=c=>c===0?["sun","晴"]:c<=2?["cloudsun","晴時多雲"]:c===3?["cloud","陰天"]:c<=48?["cloud","有霧"]:(c<=67||(c>=80&&c<=82))?["rain","有雨"]:(c<=77||c===85||c===86)?["cloud","下雪"]:["rain","雷雨"];
async function loadWeather(){
 const cached=store.get("wx");if(cached&&cached.days)forecast=cached;
 if(cached&&Date.now()-(cached.fetched||0)<3*3600e3)return;
 const names=Object.keys(LOC);
 try{
  const url="https://api.open-meteo.com/v1/forecast?latitude="+names.map(n=>LOC[n][0]).join(",")+"&longitude="+names.map(n=>LOC[n][1]).join(",")+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16";
  const r=await fetch(url);if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
  const days={...((cached&&cached.days)||{})};let got=0;
  DAYS.forEach(x=>{const d=j[names.indexOf(x.wx[0])]?.daily;if(!d)return;const i=d.time.indexOf(`${YEAR}-${x.d.replace("/","-")}`);if(i<0)return;const[icon,desc]=WMO(d.weather_code[i]);days[x.d]={hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),icon,desc,pop:d.precipitation_probability_max[i]};got++});
  forecast={updated:new Date().toISOString(),fetched:Date.now(),days};store.set("wx",forecast);
  if(!got)return;
  if(tab==="wx")render(true);else if(tab==="plan"&&view==="day"){const b=document.getElementById("dayBody");if(b){b.innerHTML=dayBodyHTML();bindSched();pinCheck()}}
 }catch(_){}
}
loadWeather();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadWeather()});

function suDetect(k){

 if(k==="notify")return notifyOn&&(!canNotify()||Notification.permission==="granted");

}
async function setupSet(k,v){

 const hole=v.querySelector(".coach-hole"),tip=v.querySelector(".coach-tip"),txt=v.querySelector(".coach-bub p"),dots=[...v.querySelectorAll(".coach-dots i")],next=v.querySelector("[data-coach-next]"),skip=v.querySelector("[data-coach-skip]"),catU=v.querySelector(".coach-cat use");

/* ===== 匯率自動更新：每 6 小時最多抓一次，主來源 ExchangeRate-API，備用 currency-api；手動改過就停止自動 ===== */
const RATE_SRC=[["ExchangeRate-API","https://open.er-api.com/v6/latest/JPY",j=>j&&j.result==="success"&&j.rates&&j.rates.TWD,"https://www.exchangerate-api.com"],["currency-api","https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json",j=>j&&j.jpy&&j.jpy.twd,"https://github.com/fawazahmed0/exchange-api"]];
const RATE_EVERY=6*3600e3;
let rateErr="";
function rateNoteHTML(){
 if(rateErr)return `<div class="rate-note err" role="alert"><span>${rateErr}</span></div>`;
 const t=rateMeta.ts?new Date(rateMeta.ts):null,when=t?`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`:"";
 if(!rateMeta.auto)return `<div class="rate-note"><span>手動設定${when?`・${when}`:""}</span>${canWrite?`<button type="button" data-rate-auto>改回自動</button>`:""}</div>`;
 const src=RATE_SRC.find(r=>r[0]===rateMeta.src);
 return `<div class="rate-note"><span>${rateMeta.ts?`<i class="live" aria-hidden="true"></i>自動更新・${when}`:"自動更新・等待連線"}</span>${src?`<span>匯率來源：<a href="${src[3]}" target="_blank" rel="noopener">${src[0]}</a></span>`:""}</div>`;
}
async function fetchRate(force){
 if(rateBusy||!rateMeta.auto)return;if(!force&&rateMeta.ts&&Date.now()-rateMeta.ts<RATE_EVERY)return;if(!navigator.onLine)return;
 rateBusy=true;
 try{
  for(const [name,url,pick] of RATE_SRC){
   try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);const r=await fetch(url,{cache:"no-store",signal:ctl.signal});clearTimeout(to);if(!r.ok)continue;
    const v=+pick(await r.json());if(!(v>0.1&&v<0.5))continue;
    rate=Math.round(v*10000)/10000;rateMeta={auto:true,ts:Date.now(),src:name};store.set("rate",rate);store.set("rateMeta",rateMeta);
    if(tab==="acct")renderAcct();else if(tab==="plan"&&view==="home"&&todayIdx<0&&diff<=0)render(true);
    if(db&&canWrite)put("settings/rate",{jpyTwd:rate,auto:true,ts:rateMeta.ts,src:name});
    return}catch(_){}
  }
 }finally{rateBusy=false}
}

/* 電話號碼轉 tel:。分機（#、轉、分機、ext、x）不黏在主號後面，用「,」隔開（撥通後停一下再按分機） */
function telHref(raw){
 const t=String(raw||"").normalize("NFKC"),m=t.split(/#|＃|轉|分機|ext\.?|\bx(?=\s*\d)/i);
 const main=(m[0]||"").replace(/[^\d+]/g,""),ext=(m[1]||"").replace(/\D/g,"");
